name: Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs that push the same tag must not race each other
concurrency:
  group: publish-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  # Run lint, type checks, and tests before taking a build runner.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: sengi-basic-8-ubuntu-2404
    concurrency:
      group: sengi-8-vcpu
      queue: max
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make the version and the tags
        id: meta
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          : "${DOCKER_HUB_USERNAME:?Set the DOCKER_HUB_USERNAME repository variable}"
          IMAGE="${DOCKER_HUB_USERNAME}/dockge-mod"
          BASE="$(node -p "require('./package.json').version")"
          # The build date, so the tags sort by release. A second release on
          # the same day gets a counter: 1.5.0-mod-2026-09-29-2.
          DATE="$(date -u +%Y-%m-%d)"
          VERSION="${BASE}-mod-${DATE}"
          N=2
          while curl -fsS -o /dev/null "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${VERSION}"; do
            VERSION="${BASE}-mod-${DATE}-${N}"
            N=$((N + 1))
          done
          TAGS="${IMAGE}:${VERSION}"
          # Only the default branch moves the latest tag
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"
          echo "Image version \`${VERSION}\` from commit \`${GITHUB_SHA}\`. Tag that commit with the same name." >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set the APT cache key for both builds
        run: printf '%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > docker/apt-cache-key

      - name: Build AMD64 smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64
          load: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: dockge-mod:smoke
          cache-from: type=gha

      - name: Smoke-test the AMD64 image
        run: |
          container=$(docker run -d -p 127.0.0.1::5001 \
            --health-interval=2s --health-start-period=1s \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKGE_STACKS_DIR=/opt/stacks dockge-mod:smoke)
          trap 'docker rm -fv "$container" >/dev/null' EXIT
          address=$(docker port "$container" 5001/tcp)
          for i in $(seq 1 45); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy ] &&
               curl -fsS --max-time 2 "http://$address/" | grep -q '<div id="app"'; then
              echo "The setup page responds and the container is healthy."
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          docker inspect --format '{{json .State.Health}}' "$container"
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=dockge-mod
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          # A cache error must not fail a build that is already pushed
          cache-to: type=gha,mode=max,ignore-error=true

  description:
    needs: publish
    uses: ./.github/workflows/dockerhub-description.yml
    secrets:
      DOCKER_HUB_DESCRIPTION_KEY: ${{ secrets.DOCKER_HUB_DESCRIPTION_KEY }}
