name: Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs that push the same tag must not race each other
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The lint, the tests, and a start of the image must pass first
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: sengi-basic-8-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make the version and the tags
        id: meta
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          : "${DOCKER_HUB_USERNAME:?Set the DOCKER_HUB_USERNAME repository variable}"
          IMAGE="${DOCKER_HUB_USERNAME}/dockge-mod"
          BASE="$(node -p "require('./package.json').version")"
          # The build date, so the tags sort by release. A second release on
          # the same day gets a counter: 1.5.0-mod-2026-09-29-2.
          DATE="$(date -u +%Y-%m-%d)"
          VERSION="${BASE}-mod-${DATE}"
          N=2
          while curl -fsS -o /dev/null "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${VERSION}"; do
            VERSION="${BASE}-mod-${DATE}-${N}"
            N=$((N + 1))
          done
          TAGS="${IMAGE}:${VERSION}"
          # Only the default branch moves the latest tag
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"
          echo "Image version \`${VERSION}\` from commit \`${GITHUB_SHA}\`. Tag that commit with the same name." >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=dockge-mod
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          # Run APT even when the pinned base image is unchanged.
          no-cache-filters: base
          cache-from: type=gha
          # A cache error must not fail a build that is already pushed
          cache-to: type=gha,mode=max,ignore-error=true
