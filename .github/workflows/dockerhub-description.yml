name: Docker Hub Description

# Copy the README and the short description to the Docker Hub page
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SYNC_DOCKER_HUB_DESCRIPTION: ${{ secrets.DOCKER_HUB_DESCRIPTION_KEY != '' && 'yes' || 'no' }}

    steps:
      - name: Checkout
        if: env.SYNC_DOCKER_HUB_DESCRIPTION == 'yes'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Updating the description requires a separate token with Read, Write, Delete access.
      - name: Update the Docker Hub description
        if: env.SYNC_DOCKER_HUB_DESCRIPTION == 'yes'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_DESCRIPTION_KEY }}
          repository: ${{ vars.DOCKER_HUB_USERNAME }}/dockge-mod
          short-description: Drop-in replacement for Dockge, with update checks, notifications, and backups.
          enable-url-completion: true
