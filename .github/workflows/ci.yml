name: CI

on:
  workflow_call:

permissions:
  contents: read

# Share the 2-vCPU slot with the Docker Hub description workflow.
jobs:
  check:
    runs-on: sengi-basic-2-ubuntu-2404
    concurrency:
      group: sengi-2-vcpu
      queue: max
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the types
        run: npm run check-ts

      - name: Run the tests
        run: npm test
