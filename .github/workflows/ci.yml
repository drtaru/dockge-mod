name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  # The publish workflow calls this, so an image is never pushed without
  # a passing check
  workflow_call:

permissions:
  contents: read

# Share one slot per runner size across the repository's workflows.
jobs:
  check:
    runs-on: sengi-basic-2-ubuntu-2404
    concurrency:
      group: sengi-2-vcpu
      queue: max
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the types
        run: npm run check-ts

      - name: Run the tests
        run: npm test

      - name: Build the frontend
        run: npm run build:frontend

  # Build the image and start it, so a broken Dockerfile or a missing
  # runtime file fails here and not after a publish
  image:
    runs-on: sengi-basic-8-ubuntu-2404
    concurrency:
      group: sengi-8-vcpu
      queue: max
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64
          push: false
          load: true
          tags: dockge-mod:ci
          # Run APT even when the pinned base image is unchanged.
          no-cache-filters: base
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Start the image and wait for the setup page
        run: |
          docker run -d --name smoke -p 5001:5001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKGE_STACKS_DIR=/opt/stacks \
            dockge-mod:ci
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:5001/ | grep -q '<div id="app"'; then
              echo "The server answers"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Wait for the healthcheck
        run: |
          # The first check runs one interval (60 s) after the start
          for i in $(seq 1 75); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            if [ "$status" = "healthy" ]; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          docker inspect --format '{{json .State.Health}}' smoke
          exit 1
